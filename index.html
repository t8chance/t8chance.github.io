<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港熱帶氣旋警告信號預測 · Hong Kong typhoon signal forecasts</title><script>try{var l=localStorage.getItem("hk_lang"),m=localStorage.getItem("hk_mode");if((l==="en"||l==="zh")&&(m==="basic"||m==="advanced"))location.replace("site/index"+(l==="zh"?"-zh":"")+".html")}catch(e){}</script><style>:root{--bg:#eef2f5;--fg:#13202b;--mut:#5b6873;--card:#fff;--line:#d3dbe2;--on:#13202b;--onfg:#fff}@media (prefers-color-scheme:dark){:root{--bg:#111820;--fg:#e8eef3;--mut:#9aa7b2;--card:#1b242d;--line:#33404c;--on:#e8eef3;--onfg:#13202b}}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang HK","Noto Sans TC",sans-serif}main{max-width:600px;margin:0 auto;padding:12vh 16px 40px;text-align:center}h1{font-size:30px;margin:0 0 6px;text-wrap:balance}.sub{color:var(--mut);margin:0 0 30px;font-size:17px}.q{font-size:14px;color:var(--mut);letter-spacing:.04em;margin:22px 0 10px}.ch{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.ch button{font:inherit;cursor:pointer;min-width:150px;max-width:270px;padding:14px 20px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-align:center}.ch button b{display:block;font-size:20px}.ch button small{display:block;margin-top:6px;font-size:13px;line-height:1.4;color:inherit;opacity:.8}.ch button.on{background:var(--on);color:var(--onfg);border-color:var(--on)}.go{display:inline-block;margin:34px 0 0;padding:15px 34px;border-radius:999px;background:var(--on);color:var(--onfg);font-size:19px;font-weight:700;text-decoration:none}</style></head><body><main><h1>香港熱帶氣旋警告信號預測</h1><p class="sub">Hong Kong typhoon signal forecasts</p><div class="q">語言 · Language</div><div class="ch" id="lang"><button type="button" data-l="zh" class="on" lang="zh-Hant"><b>中文</b></button><button type="button" data-l="en" lang="en"><b>English</b></button></div><div class="q">模式 · Mode</div><div class="ch" id="mode"><button type="button" data-m="basic" class="on"><b>簡易 · Basic</b><small>各級信號的機會率及熱帶氣旋可能路徑<br>Signal chances and the possible paths</small></button><button type="button" data-m="advanced"><b>進階 · Advanced</b><small>全部資料，包括測風站及各個預報模式<br>Everything, incl. stations and each forecast model</small></button></div><a class="go" id="go" href="site/index-zh.html?mode=basic">開啟預報 · Open</a><script>var L="zh",M="basic";try{var l0=localStorage.getItem("hk_lang");if(l0==="en"||l0==="zh")L=l0}catch(e){}function upd(){document.querySelectorAll("#lang button").forEach(function(b){b.className=b.dataset.l===L?"on":""});document.querySelectorAll("#mode button").forEach(function(b){b.className=b.dataset.m===M?"on":""});document.getElementById("go").href="site/index"+(L==="zh"?"-zh":"")+".html?mode="+M}document.querySelectorAll("#lang button").forEach(function(b){b.onclick=function(){L=b.dataset.l;upd()}});document.querySelectorAll("#mode button").forEach(function(b){b.onclick=function(){M=b.dataset.m;upd()}});document.getElementById("go").onclick=function(){try{localStorage.setItem("hk_lang",L);localStorage.setItem("hk_mode",M)}catch(e){}};upd()</script></main></body></html>
