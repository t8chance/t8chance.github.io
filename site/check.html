<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compared with HKO</title>
<style>
 :root{--ink:#1a1a1a;--mut:#6a6a6a;--line:#e3e3e3;--bg:#fbfaf8;--card:#fff;--dot:#2b6cb0;--hi:#d62728;--grid:#e6e6e6}
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ececec;--mut:#a3a3a3;--line:#333;--bg:#161616;--card:#1f1f1f;--dot:#6fa8e8;--hi:#ff5a4e;--grid:#2c2c2c}}
 :root[data-theme="dark"]{--ink:#ececec;--mut:#a3a3a3;--line:#333;--bg:#161616;--card:#1f1f1f;--dot:#6fa8e8;--hi:#ff5a4e;--grid:#2c2c2c}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
 h1{font-size:21px;margin:6px 0 2px} p{margin:4px 0} .note{color:var(--mut);font-size:13px} a{color:#2b7fd4}
 .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
 .tabs button{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
 .tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
 .box{display:flex;flex-wrap:wrap;gap:8px 22px;margin:6px 0 4px;font-size:14px} .box b{font-weight:700} .hi{color:var(--hi);font-weight:700}
 svg{width:100%;max-width:640px;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0}
 svg text{fill:var(--mut);font-size:11px} svg .ax{stroke:var(--line)} svg .gr{stroke:var(--grid)} svg .one{stroke:var(--ink);stroke-dasharray:5 4}
 svg .d{fill:var(--dot);opacity:.32} svg .r{fill:var(--hi);stroke:var(--card);stroke-width:1.2}
</style></head><body><div class="wrap">
<p><a href="index.html">← back to the forecasts</a> · <a href="inputs.html">Inputs by year</a> · <a href="method.html">Method</a></p>
<h1 id="h">Compared with HKO</h1>
<p class="note" id="sub"></p>
<div class="tabs" id="tabs"><button data-v="strength">Storm strength</button><button data-v="reach">Gale-wind reach toward Hong Kong</button></div>
<div class="box" id="box"></div>
<svg id="plot" viewBox="0 0 640 640" role="img" aria-label="forecast against HKO's record"></svg>
<p class="note" id="read"></p>
<script src="inputs/check_points.js"></script>
<script>
const $=s=>document.querySelector(s), NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t); for(const k in a)e.setAttribute(k,a[k]); return e};
const q=new URLSearchParams(location.search), C=window.CHECK;
let M=q.get("m")||"ifs2025", V=q.get("v")==="reach"?"reach":"strength"; const S=q.get("s")||"", y26=q.get("y26")==="1";
const CLS=[[34,"storm"],[48,"severe storm"],[64,"typhoon"],[81,"severe typhoon"],[100,"super typhoon"]];
const name=k=>(C&&C.names[k])||(k?k.replace(/_(\d{4})$/," $1").replace(/_/g," ").toLowerCase().replace(/\b\w/g,x=>x.toUpperCase()):"");
const dir=(b,u)=>Math.round(b)===0?"about right on average":`average too ${b>0?"high":"low"} by ${Math.abs(Math.round(b))} ${u}`;
function draw(){
 if(!C||!C.methods[M]){$("#sub").textContent="No data for this forecast."; return}
 const m=C.methods[M], d=m[V], st=V==="strength", lim=st?150:500, u=st?"kt":"km", s=$("#plot"); s.innerHTML="";
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===V));
 $("#h").textContent=`${st?"Storm strength":"Gale-wind reach toward Hong Kong"} — ${m.title}`;
 $("#sub").textContent=`${m.sub[V]}. Each dot = one storm at one time in one forecast (the middle of all versions), against what HKO recorded.`
  +(y26?" This run is from 2026, which HKO has not yet published, so it is shown on the 2025 check of the same method.":"");
 const W=640,L=58,R=14,T=14,B=50,pw=W-L-R,ph=W-T-B, X=v=>L+v/lim*pw, Y=v=>T+ph-v/lim*ph, step=st?20:100;
 for(let v=0;v<=lim;v+=step){
  if(!st){s.appendChild(el("line",{x1:X(v),x2:X(v),y1:Y(0),y2:Y(lim),class:"gr"})); s.appendChild(el("line",{x1:X(0),x2:X(lim),y1:Y(v),y2:Y(v),class:"gr"}))}
  const tx=el("text",{x:X(v),y:Y(0)+16,"text-anchor":"middle"}); tx.textContent=v; s.appendChild(tx);
  const ty=el("text",{x:L-8,y:Y(v)+4,"text-anchor":"end"}); ty.textContent=v; s.appendChild(ty)}
 if(st)CLS.forEach(([v,lab])=>{s.appendChild(el("line",{x1:X(v),x2:X(v),y1:Y(0),y2:Y(lim),class:"gr"})); s.appendChild(el("line",{x1:X(0),x2:X(lim),y1:Y(v),y2:Y(v),class:"gr"}));
  const t=el("text",{x:X(v)+3,y:T+12+(CLS.findIndex(c=>c[0]===v)%2)*13,"font-size":10}); t.textContent=lab; s.appendChild(t)});
 s.appendChild(el("rect",{x:L,y:T,width:pw,height:ph,fill:"none",class:"ax"}));
 s.appendChild(el("line",{x1:X(0),y1:Y(0),x2:X(lim),y2:Y(lim),class:"one"}));
 const xl=el("text",{x:L+pw/2,y:W-10,"text-anchor":"middle","font-size":12}); xl.textContent=st?"HKO's recorded strength (knots)":"HKO's gale-wind reach toward Hong Kong (km)"; s.appendChild(xl);
 const yl=el("text",{x:14,y:T+ph/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 14 ${T+ph/2})`}); yl.textContent=st?"strength the page used (knots)":"reach the page drew (km)"; s.appendChild(yl);
 const si=d.keys.indexOf(S), red=[];
 d.pts.forEach(p=>{const c=Math.min(p[0],lim), v=Math.min(p[1],lim); if(p[2]===si){red.push(p);return} s.appendChild(el("circle",{cx:X(c),cy:Y(v),r:2.6,class:"d"}))});
 red.forEach(p=>{const c=el("circle",{cx:X(Math.min(p[0],lim)),cy:Y(Math.min(p[1],lim)),r:4.2,class:"r"}), t=el("title",{});
  t.textContent=`${name(S)} · run ${p[3].slice(6,8)}/${p[3].slice(4,6)}/${p[3].slice(0,4)} ${p[3].slice(8,10)}Z · ${p[4]}Z: HKO ${p[0]} ${u}, page ${p[1]} ${u}`; c.appendChild(t); s.appendChild(c)});
 const [b,mae,n]=d.stats;
 let h=`<span><b>${m.title}:</b> ${n} storms · ${dir(b,u)} · typical miss ${Math.round(mae)} ${u}</span>`;
 if(S&&si>=0){const [sb,sm]=d.per[S]; h+=`<span class="hi">● ${name(S)}: ${dir(sb,u)} · typical miss ${Math.round(sm)} ${u} (${red.length} dots)</span>`}
 else if(S) h+=`<span class="note">${name(S)} is not on this check${y26||/_2026$/.test(S)?": HKO has not yet published 2026":st?" (no forecast time matched to HKO's track)":(d.why||{})[S]==="dashed"?": on these pages it is drawn only as another storm's dashed second storm, which carries no wind rings":(d.why||{})[S]==="nogale"?": HKO recorded no gale winds reaching toward Hong Kong at the matched times":" (no forecast time matched to HKO's track)"}.</span>`;
 $("#box").innerHTML=h;
 $("#read").textContent=`On the dashed line = same as HKO; above = too ${st?"strong":"far"}, below = too ${st?"weak":"short"}.`+(red.length?" Hover a red dot for its run and time.":"");
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{V=b.dataset.v; q.set("v",V); history.replaceState(null,"","?"+q.toString()); draw()});
draw();
</script>
</div></body></html>
