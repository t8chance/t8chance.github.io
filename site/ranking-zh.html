  return `<tr class="${sig===10?"s10":sig===9?"s9":""}${me&&key(r)===me?" me":""}"><td>${i}</td><td class="l">${r.y} ${nm(r)}${OLDM(r)||""}${me&&key(r)===me?` <span class="mut">${T("· this storm","· 本熱帶氣旋")}</span>`:""}</td>`
   +`<td><span class="sg sg${sig}">${ZH?SIGZ[sig]:"No. "+sig}</span></td>`
   +(SHOWCAT?`<td>${r.cat?(ZH?CAT[r.cat][1]:CAT[r.cat][0])+pre+(r.catbt?"<sup>≈</sup>":""):"–"}</td>`:"")
   +`<td>${r.dir?(ZH?DIRZ[r.dir]:r.dir)+pre:"–"} ${r.km!=null?r.km+pre:""}</td><td>${r.a60!=null?r.a60.toFixed(1):"–"}</td><td><b>${r.a10.toFixed(1)}</b></td><td>${r.g}${r.old&&r.nst<8?T(` of ${r.nst}`,`／${r.nst}`):""||""}</td></tr>`};
 let body="", i=0, put=false;
 rows.forEach(r=>{if(fcRow&&!put&&r.a10<=F.v){i++; put=true; body+=fcTr(i)} i++; body+=NAR?rowN(r,i):rowH(r,i)});
 if(fcRow&&!put){i++; body+=fcTr(i)}
 function fcTr(k){if(NAR)return `<tr class="fc"><td>${k}</td><td class="l">${T("This forecast","本預報")} <span class="mut">${F.m?mLab():""}</span></td><td>${Math.round(F.v)}</td><td>${gTxt}</td></tr>`;
  return `<tr class="fc"><td>${k}</td><td class="l">${T("This forecast","本預報")} <span class="mut">${F.m?mLab():""}</span></td><td><span class="sg sgf">${T("forecast","預測")}</span></td>`
  +(SHOWCAT?`<td>${FILLF&&F.cc&&CAT[F.cc]?(ZH?CAT[F.cc][1]:CAT[F.cc][0]):"–"}</td>`:"")+`<td>${FILLF&&F.cd&&DIRZ[F.cd]&&F.ca!=null?(ZH?DIRZ[F.cd]:F.cd)+" "+F.ca:"–"}</td><td>–</td><td>${Math.round(F.v)}</td><td>${gTxt}</td></tr>`}
 h+=`<div class="tw"><table${NAR?' class="nar"':""}><thead>${NAR?headN:head}</thead><tbody>${body}</tbody></table></div>`;+(NAR?`<p class="note">${T(`On a wider screen the table also shows the ${SHOWCAT?"category, ":""}direction and distance at closest approach and the 60-minute average.`,`在較闊的屏幕上，此表亦會顯示最接近時的${SHOWCAT?"強度、":""}方位及距離和 60 分鐘平均值。`)}</p>`:"");
 h+=`<div class="key">${rows.some(r=>r.sig===10)?`<span><i style="background:var(--r10)"></i>${T("No. 10","十號")}</span>`:""}${rows.some(r=>r.sig===9)?`<span><i style="background:var(--r9)"></i>${T("No. 9","九號")}</span>`:""}${fcRow?`<span><i style="background:var(--fcbg);border-color:var(--fc)"></i>${T("this forecast","本預報")}</span>`:""}</div>`;
 if(RKOLD) h+=`<p class="note">${T(`Storms before 2008 (marked h or ≈) come from Wikipedia's station tables or HKO's annual reports. Hourly means are converted to 10-minute equivalents with the ratio measured at these stations, and a station without a record is filled in from the others, scaled by its usual exposure, so their averages are estimates. Their gale count covers only the stations with a record. Storms with records from only 2 or 3 of the 8 stations are marked rough. Tested on storms since 2007 with every station known, the filled-in average is off by about 3 km/h with 2 or 3 stations (5 to 6 km/h for the strongest storms) and by under 1 km/h with 7. Before 1986 three stations read differently from today's sites, measured against Waglan Island in storms on similar tracks. Kai Tak read about 40% higher, Chek Lap Kok (then a hill station on the island) about 30% higher and Cheung Chau about 7% lower, so for 1979 to 1985 these three are scaled to today's sites before averaging.`,`2008 年以前的熱帶氣旋（標示 h 或 ≈）資料來自維基百科的測風站表格或天文台年刊。每小時平均風速按這些測風站的實測比率換算為十分鐘平均風速；缺少紀錄的測風站則按其他測風站的數值及該站一般的受風程度推算，故平均值只屬估算。烈風站數只計算有紀錄的測風站。八個測風站中只有兩或三個有紀錄的熱帶氣旋標示為「粗略」。以 2007 年以來所有測風站均有紀錄的熱帶氣旋測試，只有兩或三個測風站時，推算的平均值約相差每小時 3 公里（最強的熱帶氣旋相差 5 至 6 公里），有七個測風站時則相差不足 1 公里。1986 年以前，以橫瀾島作比較，在路徑相近的熱帶氣旋中，啟德的讀數約高出 40%，赤鱲角（當時為島上山頭的測風站）約高出 30%，長洲則約低 7%，因此 1979 至 1985 年這三站先換算至現址水平才計算平均值。`)}</p>`;
 h+=`<p class="note">${T(`Ranked by the 10-minute average, the one this site estimates (the Observatory's own table ranks by the 60-minute column). No. 8 or higher: the Observatory's 2007–2026 comparison table (cases in 2012 or earlier use the Lau Fau Shan station; # = preliminary). No. 3: the Observatory's tropical cyclone reports as compiled on Wikipedia; the Observatory's table gives no 60-minute average${SHOWCAT?" or category":""} for them${SHOWCAT?" (≈ = category from the Observatory's best track, its strongest hour within 3 hours of closest approach; done this way, 36 of the 40 storms in the Observatory's table get its own category)":""}.${fcRow?" The forecast row is a reference only: one member's estimated station winds, averaged.":""}`,
  `按 10 分鐘平均值排列（即本網站估算的數值；天文台的原表按 60 分鐘欄排列）。八號或以上：天文台 2007 至 2026 年比較表（2012 年或以前的個案以流浮山測風站統計；# 為初步數據）。三號：天文台熱帶氣旋報告（維基百科整理）；天文台的表沒有這些熱帶氣旋的 60 分鐘平均值${SHOWCAT?"及強度":""}${SHOWCAT?"（≈ 為按天文台最佳路徑估計的強度：取最接近時前後 3 小時內的最高強度；以此方法，天文台表中 40 個熱帶氣旋有 36 個與其所列強度相同）":""}。${fcRow?"預測一行僅供參考：為單一成員估算的各站風速平均。":""}`)}</p>`;
 if(!fcRow) h+=`<p class="note">${T("To place a forecast here, open a run on the forecast page, then 'Stations' → 'See it in the storm ranking'.","如要把預測放進此表：在預報頁打開一個運行，再按「測風站」→「在熱帶氣旋排名中查看」。")}</p>`;
 const M=document.getElementById("main"); M.innerHTML=h;
 M.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{GRP=b.dataset.a; draw()});
 M.querySelectorAll("[data-rkold]").forEach(b=>b.onclick=()=>{RKOLD=!RKOLD; draw()});
 const fr=M.querySelector("tr.fc"); if(fr&&!draw.done){draw.done=true; setTimeout(()=>{try{fr.scrollIntoView({block:"center"})}catch(e){}},80)}
}
draw();
addEventListener("resize",()=>{if((innerWidth<700)!==draw.nar)draw()});
})();
</script>
